name: CI

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # 同一 PR / ブランチへの連続 push 時は古い実行を自動キャンセルする
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # サブプロジェクト単位の変更検知（該当ディレクトリ変更時のみ関連ジョブを実行する）
    changes:
        name: Detect Changed Paths
        runs-on: ubuntu-latest
        outputs:
            expression_alignment: ${{ steps.filter.outputs.expression_alignment }}
            android: ${{ steps.filter.outputs.android }}
            python_services: ${{ steps.filter.outputs.python_services }}
        steps:
            - name: Checkout code
              if: github.event_name != 'workflow_dispatch'
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check changed paths
              id: filter
              if: github.event_name != 'workflow_dispatch'
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      expression_alignment:
                          - 'packages/expression-alignment/**'
                          - '__tests__/expression-alignment/**'
                          - '.github/workflows/ci.yml'
                      android:
                          - 'android/**'
                          - '.github/workflows/ci.yml'
                      python_services:
                          - 'python-services/**'
                          - '.github/workflows/ci.yml'

    # メインアプリ（Nuxt / Vue / Electron）の lint・型チェック・Vitest 単体テスト（毎回実行）
    app-check:
        name: App Lint / Typecheck / Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
                  cache-dependency-path: 'app/package-lock.json'

            - name: Install native canvas dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libcairo2-dev \
                      libpango1.0-dev \
                      libjpeg-dev \
                      libgif-dev \
                      librsvg2-dev

            - name: Install expression-alignment runtime dependencies
              # app/vitest.config.ts の @techstark/opencv-js alias 解決に必要
              working-directory: packages/expression-alignment
              run: npm install --omit=dev --no-audit --no-fund

            - name: Install app dependencies
              working-directory: app
              run: npm ci

            - name: Lint (Biome)
              working-directory: app
              run: npm run lint

            - name: Typecheck (Vue / Nuxt & Electron)
              working-directory: app
              run: npm run typecheck:all

            - name: Unit Tests (Vitest)
              # CI=true により外部 AI サービス実機接続テストは vitest.config.ts 側で除外される
              working-directory: app
              env:
                  CI: 'true'
              run: npm test

    # メインアプリの実ブラウザテスト（Vitest Browser Mode + Playwright Chromium、毎回実行）
    app-browser-test:
        name: App Browser Tests (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
                  cache-dependency-path: 'app/package-lock.json'

            - name: Install native canvas dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libcairo2-dev \
                      libpango1.0-dev \
                      libjpeg-dev \
                      libgif-dev \
                      librsvg2-dev

            - name: Install expression-alignment runtime dependencies
              working-directory: packages/expression-alignment
              run: npm install --omit=dev --no-audit --no-fund

            - name: Install app dependencies
              working-directory: app
              run: npm ci

            - name: Install Playwright Chromium
              working-directory: app
              run: npx playwright install --with-deps chromium

            - name: Browser Tests (Vitest Browser Mode)
              working-directory: app
              run: npm run test:browser

    # 表情位置合わせパッケージの型チェック・単体/ゴールデンテスト（該当変更時または手動実行）
    expression-alignment:
        name: Expression Alignment Package Tests
        needs: changes
        if: needs.changes.outputs.expression_alignment == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'

            - name: Install native canvas dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libcairo2-dev \
                      libpango1.0-dev \
                      libjpeg-dev \
                      libgif-dev \
                      librsvg2-dev

            - name: Install dependencies
              working-directory: packages/expression-alignment
              run: npm install --no-audit --no-fund

            - name: Typecheck
              working-directory: packages/expression-alignment
              run: npm run typecheck

            - name: Unit & Golden IoU Tests
              working-directory: packages/expression-alignment
              run: npm test

    # Android アプリのユニットテスト（該当変更時または手動実行）
    android-test:
        name: Android Unit Tests
        needs: changes
        if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Android Unit Tests
              working-directory: android
              run: |
                  chmod +x gradlew
                  ./gradlew testDebugUnitTest --no-daemon

    # Python 画像処理サービスのユニットテスト（該当変更時または手動実行）
    python-test:
        name: Python Services Unit Tests
        needs: changes
        if: needs.changes.outputs.python_services == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: 'python-services/uv.lock'

            - name: Install Python version
              working-directory: python-services
              run: uv python install

            - name: Run Python Unit Tests
              working-directory: python-services
              run: uv run --frozen pytest tests/

    # Gemini / OpenAI 実接続テスト（Secrets 登録済みかつ同一リポジトリ内の実行時のみ実施）
    live-ai-test:
        name: Live AI Connection Tests (Gemini / OpenAI)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check AI API secrets availability
              id: secrets_check
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  set -euo pipefail
                  if [[ -z "${GEMINI_API_KEY}" && -z "${OPENAI_API_KEY}" ]]; then
                      echo "::notice::GEMINI_API_KEY と OPENAI_API_KEY が未設定のため実接続テストをスキップします。"
                      echo "enabled=false" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi
                  if [[ -z "${GEMINI_API_KEY}" ]]; then
                      echo "::error::OPENAI_API_KEY は設定されていますが GEMINI_API_KEY が未設定です。"
                      exit 1
                  fi
                  if [[ -z "${OPENAI_API_KEY}" ]]; then
                      echo "::error::GEMINI_API_KEY は設定されていますが OPENAI_API_KEY が未設定です。"
                      exit 1
                  fi
                  echo "enabled=true" >> "${GITHUB_OUTPUT}"

            - name: Checkout code
              if: steps.secrets_check.outputs.enabled == 'true'
              uses: actions/checkout@v4

            - name: Setup Node.js
              if: steps.secrets_check.outputs.enabled == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
                  cache-dependency-path: 'app/package-lock.json'

            - name: Install native canvas dependencies
              if: steps.secrets_check.outputs.enabled == 'true'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libcairo2-dev \
                      libpango1.0-dev \
                      libjpeg-dev \
                      libgif-dev \
                      librsvg2-dev

            - name: Install app dependencies
              if: steps.secrets_check.outputs.enabled == 'true'
              working-directory: app
              run: npm ci

            - name: Run Mastra Live Tests (Gemini & OpenAI)
              if: steps.secrets_check.outputs.enabled == 'true'
              working-directory: app
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  MASTRA_TEST_GEMINI_MODEL: ${{ vars.MASTRA_TEST_GEMINI_MODEL || 'gemini-flash-lite-latest' }}
                  MASTRA_TEST_OPENAI_MODEL: ${{ vars.MASTRA_TEST_OPENAI_MODEL || 'gpt-4o-mini' }}
              run: npm run test:mastra:live

    # Branch Protection の必須チェックに設定するための集約ゲートジョブ
    ci-status:
        name: CI Status
        needs:
            - changes
            - app-check
            - app-browser-test
            - expression-alignment
            - android-test
            - python-test
            - live-ai-test
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify all CI jobs succeeded or were skipped
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  APP_CHECK_RESULT: ${{ needs.app-check.result }}
                  APP_BROWSER_RESULT: ${{ needs.app-browser-test.result }}
                  EXPRESSION_ALIGNMENT_RESULT: ${{ needs.expression-alignment.result }}
                  ANDROID_RESULT: ${{ needs.android-test.result }}
                  PYTHON_RESULT: ${{ needs.python-test.result }}
                  LIVE_AI_RESULT: ${{ needs.live-ai-test.result }}
              run: |
                  set -euo pipefail
                  echo "changes: ${CHANGES_RESULT}"
                  echo "app-check: ${APP_CHECK_RESULT}"
                  echo "app-browser-test: ${APP_BROWSER_RESULT}"
                  echo "expression-alignment: ${EXPRESSION_ALIGNMENT_RESULT}"
                  echo "android-test: ${ANDROID_RESULT}"
                  echo "python-test: ${PYTHON_RESULT}"
                  echo "live-ai-test: ${LIVE_AI_RESULT}"

                  if [[ "${CHANGES_RESULT}" != "success" ]]; then
                      echo "::error::changes が成功していません (${CHANGES_RESULT})"
                      exit 1
                  fi
                  if [[ "${APP_CHECK_RESULT}" != "success" ]]; then
                      echo "::error::app-check が成功していません (${APP_CHECK_RESULT})"
                      exit 1
                  fi
                  if [[ "${APP_BROWSER_RESULT}" != "success" ]]; then
                      echo "::error::app-browser-test が成功していません (${APP_BROWSER_RESULT})"
                      exit 1
                  fi

                  for result in "${EXPRESSION_ALIGNMENT_RESULT}" "${ANDROID_RESULT}" "${PYTHON_RESULT}" "${LIVE_AI_RESULT}"; do
                      if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
                          echo "::error::条件付き CI ジョブが失敗またはキャンセルされました (${result})"
                          exit 1
                      fi
                  done
